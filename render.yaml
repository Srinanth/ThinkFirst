services:
  # 1. ThinkFirst API Gateway (Express REST API + SSE Streaming)
  - type: web
    name: thinkfirst-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: (corepack enable || npm install -g pnpm) && pnpm install --frozen-lockfile=false && pnpm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: FRONTEND_URL
        sync: false

  # 2. Render Workflow: Classroom Insights Synthesis Cron
  - type: cron
    name: thinkfirst-insights-cron
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "0 */6 * * *"
    buildCommand: (corepack enable || npm install -g pnpm) && pnpm install --frozen-lockfile=false && pnpm run build
    startCommand: node dist/scripts/workflow-insights.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
