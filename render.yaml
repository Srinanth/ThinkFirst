services:
  # ThinkFirst API Gateway (Express REST API + SSE Streaming)
  - type: web
    name: thinkfirst-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
